services:
  - type: web
    name: news-analyzer
    env: python
    buildCommand: pip install -r requirements.txt
    # NOTE: this render.yaml is reference-only — the live Render dashboard for the
    # pr-signal-finder service overrides this with its own start command. Keep this
    # value in sync with the dashboard so anyone deploying from yaml gets a working
    # service. The flags are required for SSE: --timeout protects long audits;
    # gthread + threads handles concurrent SSE streams without blocking.
    startCommand: gunicorn app:app --timeout 1000 --worker-class gthread --threads 4
    envVars:
      - key: NEWS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11
    routes:
      - type: rewrite
        source: /media-analysis
        destination: /media-analysis
    domains:
      - innatec3.com
